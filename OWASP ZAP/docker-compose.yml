version: "3.8"

services:
  # OWASP ZAP en modo daemon para escaneo automatizado
  zap:
    image: ghcr.io/zaproxy/zaproxy:stable
    container_name: vallejobs-zap
    command: >
      zap.sh -daemon
      -port 8080
      -host 0.0.0.0
      -config api.disablekey=true
      -config api.addrs.addr.name=.*
      -config api.addrs.addr.regex=true
    ports:
      - "8080:8080"
    volumes:
      - ./reports:/zap/reports
      - ./zap-automation.yaml:/zap/automation.yaml
    networks:
      - vallejobs-network
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # Ejecutar escaneo usando el plan de automation (standalone)
  zap-scan:
    image: ghcr.io/zaproxy/zaproxy:stable
    container_name: vallejobs-zap-scan
    command: >
      zap.sh -cmd
      -autorun /zap/automation.yaml
    volumes:
      - ./zap-automation.yaml:/zap/automation.yaml
      - ./reports:/zap/reports
    extra_hosts:
      - "host.docker.internal:host-gateway"
    profiles:
      - scan

  # ZAP en modo interactivo con interfaz web
  zap-ui:
    image: ghcr.io/zaproxy/zaproxy:stable
    container_name: vallejobs-zap-ui
    command: >
      zap.sh -daemon
      -port 8080
      -host 0.0.0.0
      -config api.disablekey=true
      -config api.addrs.addr.name=.*
      -config api.addrs.addr.regex=true
    ports:
      - "8080:8080"
      - "8081:8081"
    networks:
      - vallejobs-network
    extra_hosts:
      - "host.docker.internal:host-gateway"

networks:
  vallejobs-network:
    driver: bridge
